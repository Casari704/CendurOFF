# Adresa, kterou aplikace otevře po spuštění (celá, včetně https://).
CENDUROFF_START_URL=https://casari704.github.io/CendurOFF/index.html
# Doména webu – odkazy na ni zůstanou v aplikaci, ostatní se otevřou v prohlížeči.
CENDUROFF_HOST=casari704.github.io
# Adresa serveru (stejná jako v public/config.js na webu).
CENDUROFF_API_URL=https://cenduroff-web.up.railway.app
# Verze aplikace – při každém novém APK zvyš VERSION_CODE o 1.
CENDUROFF_VERSION_CODE=17
CENDUROFF_VERSION_NAME=2.15

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
