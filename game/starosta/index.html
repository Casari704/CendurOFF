function triangulate(P){
  const n=P.length;if(n<3)return[];let idx=[...Array(n).keys()];if(polyArea(P)<0)idx.reverse();
  const cr=(a,b,c)=>(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);
  const inT=(p,a,b,c)=>cr(a,b,p)>=0&&cr(b,c,p)>=0&&cr(c,a,p)>=0;
  const res=[];let guard=0;
  while(idx.length>3&&guard++<4000){let found=false;
    for(let i=0;i<idx.length;i++){const a=idx[(i+idx.length-1)%idx.length],b=idx[i],c=idx[(i+1)%idx.length];
      if(cr(P[a],P[b],P[c])<=1e-9)continue;let ok=true;
      for(const k of idx){if(k===a||k===b||k===c)continue;if(inT(P[k],P[a],P[b],P[c])){ok=false;break}}
      if(ok){res.push([a,b,c]);idx.splice(i,1);found=true;break}}
    if(!found)break}
  if(idx.length>=3)for(let i=1;i<idx.length-1;i++)res.push([idx[0],idx[i],idx[i+1]]);
  return res;
}

  for(let i=0;i<4;i++){const A=p[i],B=p[(i+1)%4];const mx=(A[0]+B[0])/2-x,mz=(A[1]+B[1])/2-z;const l=Math.hypot(mx,mz)||1;quad3([A[0],y0,A[1]],[B[0],y0,B[1]],[B[0],y1,B[1]],[A[0],y1,A[1]],shade3(col,.9),[mx/l,0,mz/l])}}

    case 'crown':g.fillStyle=L.hair||'#5a3b22';g.beginPath();g.arc(-1,0,6.4,0,7);g.fill();g.fillStyle=L.hatC||'#ffd23a';for(let i=0;i<6;i++){const a=i*Math.PI/3;g.beginPath();g.moveTo(Math.cos(a)*4,Math.sin(a)*4);g.lineTo(Math.cos(a+.3)*8.5,Math.sin(a+.3)*8.5);g.lineTo(Math.cos(a+.6)*4,Math.sin(a+.6)*4);g.fill()}g.beginPath();g.arc(0,0,4.5,0,7);g.fill();break;

    case 'duck':g.fillStyle='#ffd23a';g.beginPath();g.arc(0,0,7.5,0,7);g.fill();g.fillStyle='#f08a1c';g.beginPath();g.ellipse(9,0,4,3,0,0,7);g.fill();g.fillStyle='#222';g.beginPath();g.arc(3,-3,1.3,0,7);g.arc(3,3,1.3,0,7);g.fill();break;

let dq=null;
const dlg=$('#dlg'),dWho=$('#dlg .who'),dTxt=$('#dlg .txt'),dCh=$('#dlg .ch'),dNext=$('#dlg .next');
function say(lines,cb){dq={lines:lines.map(l=>Array.isArray(l)?{who:l[0],text:l[1]}:l),i:0,cb,shown:0,sel:0};mode='dialog';dlg.style.display='block';$('#prompt').style.display='none';showLine()}
function showLine(){const l=dq.lines[dq.i];dWho.textContent=l.who||'';dWho.style.display=l.who?'block':'none';dq.shown=0;dTxt.textContent='';dCh.innerHTML='';dNext.style.display=l.ch?'none':'block';dTxt.style.fontStyle=l.who?'normal':'italic';sfx.blip()}
function finishTyping(){const l=dq.lines[dq.i];dq.shown=l.text.length;dTxt.textContent=l.text;if(l.ch&&!dCh.children.length){l.ch.forEach(([lab,fn],i)=>{const b=document.createElement('button');b.textContent=(i+1)+'. '+lab;b.onclick=e=>{e.stopPropagation();choose(i)};dCh.appendChild(b)});dq.sel=0;markSel()}}
function markSel(){[...dCh.children].forEach((b,i)=>b.classList.toggle('sel',i===dq.sel))}
function choose(i){const l=dq.lines[dq.i];const fn=l.ch[i][1];closeDialog();sfx.blip();if(fn)fn()}
function closeDialog(){dlg.style.display='none';const cb=dq&&dq.cb;dq=null;mode='play';return cb}
function dlgAct(){if(!dq)return;const l=dq.lines[dq.i];if(dq.shown<l.text.length){finishTyping();return}if(l.ch){choose(dq.sel);return}dq.i++;if(dq.i>=dq.lines.length){const cb=closeDialog();if(cb)cb()}else showLine()}
dlg.addEventListener('click',()=>{if(mode==='dialog')dlgAct()});
function updDialog(dt){if(!dq)return;const l=dq.lines[dq.i];if(dq.shown<l.text.length){dq.shown=Math.min(l.text.length,dq.shown+dt*55);dTxt.textContent=l.text.slice(0,Math.floor(dq.shown));if(dq.shown>=l.text.length)finishTyping()}}

let dub=true,csVoice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();csVoice=v.find(x=>/^cs/i.test(x.lang)&&/google|natural|online/i.test(x.name))||v.find(x=>/^cs/i.test(x.lang))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
const HLASY={}; // jméno -> {pitch, rate}
function hlas(who){if(!who)return{pitch:1,rate:1.05};if(HLASY[who])return HLASY[who];let h=0;for(const ch of who)h=(h*31+ch.charCodeAt(0))>>>0;return HLASY[who]={pitch:.75+(h%60)/100,rate:.95+((h>>6)%25)/100}}
const VOICES=['buttery','airy','glassy','rounded'];
function speak(who,text){if(!dub||muted)return;const clean=text.replace(/[„“…]/g,'');const h=hlas(who);
  if(CTTS){const vi=who?(Math.round(h.pitch*100)%4):0;try{CTTS.speak(clean,{voice:VOICES[vi],language:'cs',rate:clamp(h.rate,.85,1.2)}).catch(e=>{if(e&&e.code&&e.code!=='viewer_stopped'&&e.code!=='busy'){if(e.code==='not_granted'||e.code==='invalid_argument')CTTS=null;browserSpeak(clean,h)}});return}catch(e){CTTS=null}}
  browserSpeak(clean,h)}
function browserSpeak(clean,h){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(clean);u.lang='cs-CZ';if(csVoice)u.voice=csVoice;u.pitch=h.pitch;u.rate=h.rate;speechSynthesis.speak(u)}catch(e){}}

function walkable(x,y){const i=gidx(x,y);return i>=0&&SOL[i]===0}
function placeNear(x,y,avoidRoad=true){
  for(let r=0;r<80;r+=.5)for(let k=0;k<Math.max(1,r*8);k++){const a=k/Math.max(1,r*8)*Math.PI*2;const px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;
    if(!walkable(px,py))continue;if(avoidRoad&&(roadAt(px,py)&1))continue;let ok=true;for(let j=0;j<8;j++){const b=j*Math.PI/4;if(!walkable(px+Math.cos(b)*.6,py+Math.sin(b)*.6)){ok=false;break}}if(ok)return[px,py]}
  return[x,y];
}
function shorePoint(){ // nejbližší místo v hratelné oblasti k rybníku Nezmar
  const S2=2,w=Math.ceil(WM/S2)+1,h=Math.ceil(HM/S2)+1;const dist=new Float32Array(w*h).fill(1e9);const q=[];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=gidx(x*S2,y*S2);if(i>=0&&(SOL[i]&2)){dist[y*w+x]=0;q.push(y*w+x)}}
  for(let qi=0;qi<q.length;qi++){const c=q[qi],cx=c%w,cy=(c/w)|0;for(const [dx,dy] of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=w||ny>=h)continue;const j=ny*w+nx;if(dist[j]>dist[c]+1){dist[j]=dist[c]+1;q.push(j)}}}
  let best=null,bd=1e9;for(let y=0;y<h;y++)for(let x=0;x<w;x++){const px=x*S2,py=y*S2;if(!walkable(px,py)||(roadAt(px,py)&1))continue;if(dist[y*w+x]<bd){bd=dist[y*w+x];best=[px,py]}}
  return best?placeNear(best[0],best[1]):[150,250];
}

const GN={};// id -> {x,y,adj:Set}
function buildGraph(){
  for(const r of ROADS){if(!DRIVE.has(r.t)||!r.ids)continue;for(let i=0;i<r.ids.length;i++){const id=r.ids[i];const x=r.P[i][0],y=r.P[i][1];if(outsideAt(x,y))continue;if(!GN[id])GN[id]={id,x,y,adj:new Set(),w:r.w};
      if(i>0){const p=r.ids[i-1];if(GN[p]){GN[p].adj.add(id);GN[id].adj.add(p)}}}}
  // vyhodit izolované
  for(const id in GN)if(!GN[id].adj.size)delete GN[id];
}
function nearestNode(x,y){let b=null,bd=1e9;for(const id in GN){const n=GN[id];const d=Math.hypot(n.x-x,n.y-y);if(d<bd){bd=d;b=n}}return b}
function makeCar(x,y,a,type,color){const c={x,y,a,v:0,type,color,ai:null,wait:0,bumpT:0};cars.push(c);return c}
function spawnTraffic(){const ids=Object.keys(GN);const cols=['#c0392b','#2c7be5','#e1b12c','#7f8c8d','#16a085','#8e44ad','#f2f2f2','#2d3436'];
  for(let i=0;i<7;i++){const n=GN[pick(ids)];const nx=[...n.adj][0];const c=makeCar(n.x,n.y,0,'civil',cols[i%cols.length]);c.ai={from:n.id,to:nx,max:rand(7,10)}}}
function aiDrive(c,dt){
  if(c.ai.thru)return aiThru(c,dt);
  const ai=c.ai,A=GN[ai.from],B=GN[ai.to];if(!A||!B){ai.to=ai.from;return}
  let dx=B.x-A.x,dy=B.y-A.y;const L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;const off=(B.w||6)>=5?1.6:0;
  const tx=B.x-dy*off,ty=B.y+dx*off;
  const want=Math.atan2(ty-c.y,tx-c.x);c.a+=clamp(angDiff(c.a,want),-2.6*dt,2.6*dt);
  let target=ai.max;
  if(!ai.flee){const fx=c.x+Math.cos(c.a)*5,fy=c.y+Math.sin(c.a)*5;
    for(const o of cars){if(o!==c&&Math.hypot(fx-o.x,fy-o.y)<3.2){target=0;break}}
    const pv=player.car||player;if(Math.hypot(fx-pv.x,fy-pv.y)<3)target=0;
    for(const p of peds)if(Math.hypot(fx-p.x,fy-p.y)<2.2){target=0;break}
    if(c.wait>0){c.wait-=dt;target=0}}
  if(Math.abs(angDiff(c.a,want))>.5)target=Math.min(target,ai.flee?9:4);
  c.v+=clamp(target-c.v,-14*dt,6*dt);c.x+=Math.cos(c.a)*c.v*dt;c.y+=Math.sin(c.a)*c.v*dt;
  if(Math.hypot(c.x-tx,c.y-ty)<2.2||Math.hypot(c.x-B.x,c.y-B.y)<1.6){
    let opts=[...B.adj].filter(n=>n!==ai.from&&GN[n]);if(!opts.length)opts=[ai.from];
    let nx;if(ai.flee&&opts.length>1&&player.car&&Math.random()<.7){let bd=-1;for(const o of opts){const d=Math.hypot(GN[o].x-player.car.x,GN[o].y-player.car.y);if(d>bd){bd=d;nx=o}}}else nx=pick(opts);
    ai.from=ai.to;ai.to=nx}
}

  const z=npcById.spravce;const n0=nearestNode(z.x,z.y);let prev=n0.id,cur=[...n0.adj][0];for(let k=0;k<6;k++){const nb=[...GN[cur].adj].filter(x=>x!==prev);if(!nb.length)break;prev=cur;cur=nb[0]}
  bike.x=n0.x;bike.y=n0.y;bike.a=Math.atan2(GN[cur].y-n0.y,GN[cur].x-n0.x);bike.v=0;player.car=bike;
  const van=makeCar(GN[cur].x,GN[cur].y,bike.a,'van','#3f8a4a');van.ai={from:prev,to:[...GN[cur].adj].find(x=>x!==prev)||prev,max:15,flee:true};van.v=8;
  chase={van,t:100,meter:0};$('#chaseHud').style.display='block';setQ(8);cam.yaw=bike.a;
}
function updChase(dt){
  if(!chase)return;chase.t-=dt;const v=chase.van,c=player.car;
  if(c){const d=Math.hypot(c.x-v.x,c.y-v.y);if(d<10)chase.meter+=dt*.3;else chase.meter=Math.max(0,chase.meter-dt*.03);if(d<3.4&&v.bumpT<=0){chase.meter+=.2;v.bumpT=.7;cam.shake=.4;sfx.bump();say1(v,pick(['Nechte mě!','Ta voda je studená!','Já jsem starosta!']))}}
  v.bumpT-=dt;$('#chaseT').textContent=Math.max(0,Math.ceil(chase.t));$('#chaseFill').style.width=Math.min(100,chase.meter*100)+'%';
  if(chase.meter>=1){const i=cars.indexOf(v);if(i>=0)cars.splice(i,1);chase=null;$('#chaseHud').style.display='none';if(player.car)player.car.v=0;
    say([[STAROSTA,'Dobře, dobře, vzdávám se! Ale nikomu neříkej, že mě dohnala motorka.'],[HRDINA,'Pane starosto, slib je slib. A já potřebuju podpis na karneval.'],[STAROSTA,'Podepíšu ti cokoliv… ale nejdřív to musím vyřešit se svým svědomím. Vezmi mě za panem farářem ke kostelu.'],['','Starosta si sedá za tebe na motorku, v plavkách a s kachničkou. Odvez ho ke kostelu sv. Martina za farářem.']],()=>{addItem('starosta');setQ(9)});
  }else if(chase.t<=0){chase.t=999;say([['','Starosta ti ujel! Ale v Benešově se dlouho neschová… Zkus to znovu.']],startChase)}
}

/* ===================== interakce ===================== */
function nearest(){
  if(player.car){return Math.abs(player.car.v)<3?{label:'Sesednout z motorky',fn:exitBike}:null}
  let best=null,bd=2.8;
  for(const n of npcs){if(n.hidden)continue;const d=Math.hypot(player.x-n.x,player.y-n.y);if(d<bd){bd=d;best={label:(n.dog?'Pes ':'Mluvit: ')+n.name,fn:()=>talk(n)}}}
  const dd=Math.hypot(player.x-DOOR.x,player.y-DOOR.y);if(dd<bd){bd=dd;best={label:'Cedule na dveřích úřadu',fn:doorTalk}}
  const dc=Math.hypot(player.x-bike.x,player.y-bike.y);if(dc<2.6&&dc<bd+.5)best={label:'Nasednout na motorku',fn:enterBike};
  return best;
}
function interact(){const n=nearest();if(n)n.fn()}
function enterBike(){player.car=bike;bike.v=0;sfx.blip();beep(90,.4,'sawtooth',.05,40)}
function exitBike(){const c=bike;const sa=Math.sin(c.a),ca=Math.cos(c.a);
  for(const [ox,oy] of[[sa*1.3,-ca*1.3],[-sa*1.3,ca*1.3],[-ca*2,-sa*2],[sa*2,-ca*2],[-sa*2,ca*2]]){const x=c.x+ox,y=c.y+oy;if(walkable(x,y)){player.x=x;player.y=y;player.dir=c.a;player.car=null;c.v=0;c.lean=0;sfx.blip();return}}
  say1(c,'Tady se sesednout nedá!')}

/* ===================== update ===================== */
let boundMsgT=0;
function bikeHits(x,y,a){const ca=Math.cos(a),sa=Math.sin(a);for(const [lx,ly] of[[1.1,0],[-1.0,0],[.6,.35],[.6,-.35],[-.6,.35],[-.6,-.35]])if(solidAt(x+lx*ca-ly*sa,y+lx*sa+ly*ca))return true;return false}
function updateWorld(dt){
  const [ax,ay]=axes();boundMsgT-=dt;
  if(player.car){
    const c=player.car;const thr=-ay;const road=roadAt(c.x,c.y);const maxF=road?24:13;
    if(thr>0)c.v+=(c.v<0?18:10)*dt*thr;else if(thr<0)c.v+=(c.v>0?-20:-5)*dt*(-thr);else c.v-=Math.sign(c.v)*Math.min(Math.abs(c.v),4*dt);
    if(c.v>maxF)c.v=Math.max(maxF,c.v-14*dt);if(c.v<-4)c.v=-4;
    const steer=ax*clamp(Math.abs(c.v)/5,.25,1)*(2.4-Math.min(1.2,Math.abs(c.v)/20));c.a+=steer*dt*Math.sign(c.v||1);
    c.lean+=((ax*clamp(Math.abs(c.v)/12,0,1)*.45)-c.lean)*Math.min(1,dt*6);
    const nx=c.x+Math.cos(c.a)*c.v*dt,ny=c.y+Math.sin(c.a)*c.v*dt;
    if(bikeHits(nx,ny,c.a)){if(Math.abs(c.v)>5){cam.shake=.35;sfx.bump()}if(outsideAt(nx+Math.cos(c.a)*1.2,ny+Math.sin(c.a)*1.2)&&boundMsgT<=0){say1(c,'Dál už ne – tady hra končí!');boundMsgT=3}c.v*=-.3}else{c.x=nx;c.y=ny}
    for(const o of cars){const d=Math.hypot(c.x-o.x,c.y-o.y);if(d<2.4){const ux=(c.x-o.x)/(d||1),uy=(c.y-o.y)/(d||1);c.x+=ux*(2.4-d);c.y+=uy*(2.4-d);if(Math.abs(c.v)>4){sfx.bump();cam.shake=.3;if(o.ai&&!o.ai.flee){o.wait=1.2;if(Math.random()<.6)say1(o,pick(['Hej, motorkáři!','Máš řidičák z Kozmic?','Pozor na lak!']))}}c.v*=-.3}}
    for(const p of[...peds,...npcs.filter(n=>!n.hidden)]){const d=Math.hypot(c.x-p.x,c.y-p.y);if(d<1.3&&Math.abs(c.v)>2){const px=-Math.sin(c.a),py=Math.cos(c.a);const side=((p.x-c.x)*px+(p.y-c.y)*py)>=0?1:-1;const tx=p.x+px*side*1.6,ty=p.y+py*side*1.6;if(walkable(tx,ty)){p.x=tx;p.y=ty}c.v*=.6;if(p.hitT<=0){say1(p,p.dog?'Haf!':pick(['Hej! Pozor!','Jezdi pomalu, Martine!','To řeknu starostovi!','Au, moje taška!']));p.hitT=2}}}
    player.x=c.x;player.y=c.y;player.dir=c.a;
  }else{
    const run=keys['shift']||(isTouch&&Math.hypot(joy.x,joy.y)>.95);const sp=run?10:5.6;
    player.dir+=ax*2.6*dt*(ay>0.2?-1:1)*(Math.abs(ay)>.2?1:1);
    const f=-ay;player.moving=Math.abs(f)>.1||Math.abs(ax)>.1;
    if(Math.abs(f)>.1){const v=f>0?sp*f:1.8*f;const nx=player.x+Math.cos(player.dir)*v*dt,ny=player.y+Math.sin(player.dir)*v*dt;
      const hit=(x,y)=>{for(let j=0;j<8;j++){const b=j*Math.PI/4;if(solidAt(x+Math.cos(b)*.32,y+Math.sin(b)*.32))return true}for(const c of cars)if(Math.hypot(x-c.x,y-c.y)<1.6)return true;return false};
      if(!hit(nx,player.y))player.x=nx;if(!hit(player.x,ny))player.y=ny;
      if((hit(nx,ny))&&outsideAt(player.x+Math.cos(player.dir)*.8,player.y+Math.sin(player.dir)*.8)&&boundMsgT<=0){say1(player,'Sem už ne – tady hra končí.');boundMsgT=3}
      player.ph+=dt*(run?16:11)*Math.sign(f)}
    else if(Math.abs(ax)>.1)player.ph+=dt*5;
  }
  updThrough(dt);for(const c of cars)if(c.ai)aiDrive(c,dt);for(let i=cars.length-1;i>=0;i--)if(cars[i].dead)cars.splice(i,1);
  for(const p of peds){p.hitT-=dt;p.t-=dt;if(p.t<=0){p.t=rand(1.5,4);p.moving=Math.random()<.75;p.dir+=rand(-1.5,1.5)}
    if(p.moving){const nx=p.x+Math.cos(p.dir)*1.3*dt,ny=p.y+Math.sin(p.dir)*1.3*dt;const lx=nx+Math.cos(p.dir)*.6,ly=ny+Math.sin(p.dir)*.6;if(walkable(lx,ly)&&!(roadAt(lx,ly)&1)){p.x=nx;p.y=ny;p.ph+=dt*7}else p.dir+=Math.PI*rand(.5,1.5)}}
  for(const n of npcs){n.hitT-=dt;const d=Math.hypot(n.hx-n.x,n.hy-n.y);if(d>.1){n.x+=(n.hx-n.x)*Math.min(1,dt*1.2);n.y+=(n.hy-n.y)*Math.min(1,dt*1.2);n.ph+=dt*8;n.moving=true}else n.moving=false;
    if(!player.car&&Math.hypot(n.x-player.x,n.y-player.y)<6)n.dir+=angDiff(n.dir,Math.atan2(player.y-n.y,player.x-n.x))*Math.min(1,dt*5)}
  for(const b of bubbles)b.t-=dt;for(let i=bubbles.length-1;i>=0;i--)if(bubbles[i].t<=0)bubbles.splice(i,1);
  for(const c of crowd){c.cheer-=dt;if(c.cheer>0)c.ph+=dt*8}
  updHappy(dt);
  updChase(dt);
  const n=nearest();const pr=$('#prompt');
  if(n&&mode==='play'){pr.style.display='block';pr.innerHTML=`<span style="color:#e8b931">[${isTouch?'AKCE':'E'}]</span> ${n.label}`}else pr.style.display='none';
}

/* ===================== AMBIENTNÍ ZVUKY ===================== */
const AMB={on:false,birdT:1,bellT:20,stepT:0,barkT:8};
function ambStart(){const a=ac();if(!a||AMB.on)return;AMB.on=true;
  const len=a.sampleRate*2,buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AMB.noise=buf;
  const mk=(type,f)=>{const o=a.createOscillator();o.type=type;const fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.value=f;const g=a.createGain();g.gain.value=0;o.connect(fl);fl.connect(g);g.connect(a.destination);o.start();return{o,g,fl}};
  const n=a.createBufferSource();n.buffer=buf;n.loop=true;const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=350;const wg=a.createGain();wg.gain.value=0;n.connect(lp);lp.connect(wg);wg.connect(a.destination);n.start();AMB.wind={g:wg,f:lp};
  AMB.eng=mk('sawtooth',700);AMB.car=mk('sawtooth',380);AMB.car2=mk('triangle',200);}
function chirp(v){const a=AC;const o=a.createOscillator(),g=a.createGain();o.type='sine';const f=rand(2600,4300),t=a.currentTime;const n=2+(Math.random()*4|0);g.gain.setValueAtTime(0,t);
  for(let i=0;i<n;i++){const s=t+i*rand(.07,.12);o.frequency.setValueAtTime(f*rand(.9,1.1),s);o.frequency.exponentialRampToValueAtTime(f*rand(1.2,1.7),s+.05);g.gain.linearRampToValueAtTime(.018*v,s+.01);g.gain.linearRampToValueAtTime(0,s+.07)}
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+n*.13+.1)}
function bell(v){const a=AC;for(let k=0;k<5;k++){const t=a.currentTime+k*1.3;for(const [m,gv] of[[1,1],[2.76,.35],[5.4,.15]]){const o=a.createOscillator(),g=a.createGain();o.frequency.value=(k%2?294:330)*m;g.gain.setValueAtTime(.045*gv*v,t);g.gain.exponentialRampToValueAtTime(.0001,t+2.6);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+2.7)}}}
function stepSnd(v){const a=AC,t=a.currentTime;const s=a.createBufferSource();s.buffer=AMB.noise;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=rand(350,700);f.Q.value=1.2;const g=a.createGain();g.gain.setValueAtTime(.05*v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.09);s.connect(f);f.connect(g);g.connect(a.destination);s.start(t,Math.random()*1.5,.12)}
function ambUpdate(dt){
  if(AC&&!AMB.on&&(mode==='play'))ambStart();if(!AMB.on)return;const a=AC,t=a.currentTime;
  const vol=(muted||mode==='finale'||mode==='mg'||mode==='title'||mode==='end')?0:1;const set=(p,v)=>p.setTargetAtTime(v,t,.15);
  set(AMB.wind.g.gain,.03*vol+(player.car?Math.min(.05,Math.abs(player.car.v)*.002)*vol:0));set(AMB.wind.f.frequency,player.car?350+Math.abs(player.car.v)*30:350);
  if(player.car){const v=Math.abs(player.car.v);set(AMB.eng.o.frequency,48+v*6);set(AMB.eng.g.gain,(.035+v*.0012)*vol)}else set(AMB.eng.g.gain,0);
  let nc=null,nd=60;for(const c of cars){const d=Math.hypot(c.x-player.x,c.y-player.y);if(d<nd){nd=d;nc=c}}
  if(nc){const k=1-nd/60;set(AMB.car.o.frequency,(nc.type==='bus'?35:42)+Math.abs(nc.v)*4);set(AMB.car.g.gain,.05*k*k*vol);set(AMB.car2.o.frequency,30+Math.abs(nc.v)*2);set(AMB.car2.g.gain,.04*k*k*vol)}else{set(AMB.car.g.gain,0);set(AMB.car2.g.gain,0)}
  if(!vol)return;
  // ptáci – víc u stromů a v parku
  AMB.birdT-=dt;if(AMB.birdT<=0){let tr=0;for(const [x,y] of TREES)if(Math.abs(x-player.x)<25&&Math.abs(y-player.y)<25)tr++;const inPark=Math.hypot(player.x-PARK.x,player.y-PARK.y)<PARK.r+20;AMB.birdT=rand(.5,2.5)*(tr>3||inPark?1:3);chirp(clamp(.4+tr*.08,.4,1))}
  // zvony
  const ch=npcById.farar;const dch=ch?Math.hypot(ch.x-player.x,ch.y-player.y):999;AMB.bellT-=dt;if(AMB.bellT<=0){AMB.bellT=rand(70,110);if(dch<220)bell(clamp(1.2-dch/200,.15,1))}
  // kroky
  if(!player.car&&player.moving&&mode==='play'){AMB.stepT-=dt*(keys['shift']?1.7:1);if(AMB.stepT<=0){AMB.stepT=keys['shift']?.42:.32;stepSnd(1)}}
  // Baron
  const pes=npcById.pes;if(pes&&Math.hypot(pes.x-player.x,pes.y-player.y)<35){AMB.barkT-=dt;if(AMB.barkT<=0){AMB.barkT=rand(8,20);sfx.bark();say1(pes,'Haf!',1.2)}}
}

/* ===================== PRŮJEZDNÁ DOPRAVA (Opavská – Hlučínská) ===================== */
let PRIM=null,thruT=2;
function buildPrimary(){const segs=ROADS.filter(r=>r.t==='primary').map(r=>r.P.slice());if(!segs.length)return;let path=segs.shift();
  const same=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1])<1.5;
  for(let g=0;g<60&&segs.length;g++){const e=path[path.length-1],s0=path[0];let f=false;
    for(let i=0;i<segs.length;i++){const s=segs[i];if(same(s[0],e)){path=path.concat(s.slice(1));f=true}else if(same(s[s.length-1],e)){path=path.concat(s.slice(0,-1).reverse());f=true}else if(same(s[s.length-1],s0)){path=s.slice(0,-1).concat(path);f=true}else if(same(s[0],s0)){path=s.slice(1).reverse().concat(path);f=true}if(f){segs.splice(i,1);break}}if(!f)break}
  PRIM=path}
const THRUCOLS=['#c0392b','#2c7be5','#e1b12c','#7f8c8d','#16a085','#f2f2f2','#2d3436','#8e44ad','#d35400','#3b5998'];
function updThrough(dt){if(!PRIM)return;thruT-=dt;if(thruT>0)return;thruT=rand(4,10);const dir=Math.random()<.5?1:-1;const inR=p=>p[0]>-130&&p[0]<WM+130&&p[1]>-130&&p[1]<HM+130;let i0=-1;if(dir>0){for(let k=0;k<PRIM.length-1;k++)if(inR(PRIM[k])){i0=k;break}}else{for(let k=PRIM.length-1;k>0;k--)if(inR(PRIM[k])){i0=k;break}}if(i0<0)return;const p=PRIM[i0],q=PRIM[i0+dir];
  const bus=Math.random()<.2;const c=makeCar(p[0],p[1],Math.atan2(q[1]-p[1],q[0]-p[0]),bus?'bus':'civil',bus?'#f2c200':pick(THRUCOLS));c.ai={thru:true,idx:i0,dir,max:bus?11:rand(13,16)};c.v=c.ai.max}
function aiThru(c,dt){const ai=c.ai,nI=ai.idx+ai.dir;if(nI<0||nI>=PRIM.length||c.x<-150||c.x>WM+150||c.y<-150||c.y>HM+150){c.dead=true;return}
  const A=PRIM[ai.idx],B=PRIM[nI];let dx=B[0]-A[0],dy=B[1]-A[1];const L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;const tx=B[0]-dy*1.9,ty=B[1]+dx*1.9;

function mgPipes(theme){const HO=theme==='hoses';

  function dfs(c,r,vis,p){if(++iter>20000)return false;if(c===C-1&&p.length>=C+2){path=p.slice();return true}
    const dirs=shuffle([[1,0],[0,1],[0,-1],[-1,0]]);if(Math.random()<.5)dirs.sort((a,b)=>b[0]-a[0]);
    for(const [dx,dy] of dirs){const nc=c+dx,nr=r+dy;const k=nc+','+nr;if(nc<0||nr<0||nc>=C||nr>=Rw||vis.has(k))continue;vis.add(k);p.push([nc,nr]);if(dfs(nc,nr,vis,p))return true;p.pop();vis.delete(k)}return false}

  for(let i=0;i<path.length-1;i++){const [c,r]=path[i],[c2,r2]=path[i+1];const dx=c2-c,dy=r2-r;
    if(dx===1){m[r][c]|=2;m[r2][c2]|=8}if(dx===-1){m[r][c]|=8;m[r2][c2]|=2}if(dy===1){m[r][c]|=4;m[r2][c2]|=1}if(dy===-1){m[r][c]|=1;m[r2][c2]|=4}}
  m[sr][0]|=8;const er=path[path.length-1][1];m[er][C-1]|=2;
  const fill=[5,10,3,6,12,9,7,14,13,11,5,3,6];
  for(let r=0;r<Rw;r++)for(let c=0;c<C;c++){if(!m[r][c])m[r][c]=pick(fill);const n=Math.random()*4|0;for(let i=0;i<n;i++)m[r][c]=rot(m[r][c])}
  const o={title:HO?'🧺 Zapojení pračky u Miellera':'🔧 Oprava potrubí',help:HO?'Klikej (ťukej) na hadice a otáčej je, aby voda vedla od kohoutku vlevo do pračky vpravo.':'Klikej (ťukej) na trubky a otáčej je, aby voda vedla od kohoutu vlevo do odtoku vpravo.',noAct:true,m,filled:new Set(),moves:0,t:0,flow:0,
    check(){const f=new Set();const q=[];if(this.m[sr][0]&8){q.push([0,sr]);f.add('0,'+sr)}
      while(q.length){const [c,r]=q.shift();const v=this.m[r][c];for(const [b,dx,dy,ob] of [[1,0,-1,4],[2,1,0,8],[4,0,1,1],[8,-1,0,2]]){if(!(v&b))continue;const nc=c+dx,nr=r+dy;if(nc<0||nr<0||nc>=C||nr>=Rw)continue;const k=nc+','+nr;if(f.has(k))continue;if(this.m[nr][nc]&ob){f.add(k);q.push([nc,nr])}}}
      this.filled=f;return f.has((C-1)+','+er)&&(this.m[er][C-1]&2)},
    click(x,y){if(this.over)return;const c=Math.floor((x-ox)/cs),r=Math.floor((y-oy)/cs);if(c<0||r<0||c>=C||r>=Rw)return;this.m[r][c]=rot(this.m[r][c]);this.moves++;beep(500,.04,'square',.03);if(this.check()){this.done=true;mgFinish(true,HO?'Pračka točí! Mieller tleská.':'Voda teče!')}},
    update(dt){this.t+=dt},
    draw(c){
      c.fillStyle='#2b3038';c.fillRect(0,0,640,400);c.fillStyle='rgba(60,140,200,.25)';c.fillRect(0,330+Math.sin(this.t)*4,640,80);
      c.fillStyle='#1d2127';c.fillRect(ox-6,oy-6,C*cs+12,Rw*cs+12);

  // diskokoule
  c.fillStyle='rgba(0,0,0,.3)';c.beginPath();c.arc(cx+6,cy+8,26,0,7);c.fill();const gb=c.createRadialGradient(cx-8,cy-8,2,cx,cy,26);gb.addColorStop(0,'#fff');gb.addColorStop(1,'#8a8f9a');c.fillStyle=gb;c.beginPath();c.arc(cx,cy,26,0,7);c.fill();
  for(let i=0;i<10;i++){const a=fin.t*2+i*.63;c.fillStyle='rgba(255,255,255,.9)';c.fillRect(cx+Math.cos(a)*(40+i*12)-2,cy+Math.sin(a*1.3)*(30+i*10)-2,4,4)}
  // hosté
  c.save();const sc=Math.max(1.2,Math.min(2.2,Math.min(w,h)/380));
  for(const g2 of fin.guests){g2.ang+=g2.sp*dt;g2.ph+=dt*9;const x=cx+Math.cos(g2.ang)*R*g2.r*1.45,y=cy+Math.sin(g2.ang)*R*g2.r*1.05;c.save();c.translate(x,y+Math.sin(g2.ph)*3);c.scale(sc*.85,sc*.85);drawPerson(c,0,0,Math.sin(g2.ph*.5)*.8-Math.PI/2,g2.ph,g2.look,true);c.restore()}
  // hlavní postavy v kruhu
  const n=fin.d.length;
  fin.d.forEach((p,i)=>{const a=fin.t*.35+i/n*Math.PI*2;p.ph+=dt*10;p.x=cx+Math.cos(a)*R*.62;p.y=cy+Math.sin(a)*R*.5;const jump=Math.abs(Math.sin(fin.t*4+i))*6;
    c.save();c.translate(p.x,p.y-jump);c.scale(sc,sc);
    if(p.dog){drawDog(c,{x:0,y:0,dir:Math.sin(fin.t*3)})}else drawPerson(c,0,0,Math.sin(fin.t*3+i)*1.2-Math.PI/2,p.ph,p.look,true);
    c.restore();
    c.font='bold 12px Trebuchet MS, sans-serif';const tw=c.measureText(p.name).width+8;c.fillStyle='rgba(0,0,0,.6)';rr(c,p.x-tw/2,p.y+16*sc,tw,16,4);c.fill();c.fillStyle='#fff';c.textAlign='center';c.textBaseline='middle';c.fillText(p.name,p.x,p.y+16*sc+8)});
  c.restore();
  fin.bubT-=dt;if(fin.bubT<=0){fin.bub=pick(fin.d);fin.bubT=2.4}
  if(fin.bub)drawBubble(c,fin.bub.x,fin.bub.y-10*sc,fin.bub.line);
  // konfety
  if(fin.conf.length<260)for(let i=0;i<4;i++)fin.conf.push({x:Math.random()*w,y:-10,vy:rand(40,110),vx:rand(-30,30),r:Math.random()*6,c:pick(['#ff4d4d','#ffd23a','#4dd2ff','#7dff6a','#ff7ae0','#fff'])});
  for(const f of fin.conf){f.y+=f.vy*dt;f.x+=f.vx*dt+Math.sin(fin.t*3+f.r)*.5;f.r+=dt*5;c.fillStyle=f.c;c.save();c.translate(f.x,f.y);c.rotate(f.r);c.fillRect(-3,-2,6,4);c.restore()}
  fin.conf=fin.conf.filter(f=>f.y<h+10);
  // nadpis
  c.textAlign='center';c.textBaseline='middle';c.font=`bold ${Math.min(42,w/18)}px Trebuchet MS, sans-serif`;c.fillStyle='rgba(0,0,0,.6)';c.fillText('VELKÉ FINÁLE: KARNEVAL V ZÁMKU!',w/2+3,82+3);c.fillStyle='#ffd23a';c.fillText('VELKÉ FINÁLE: KARNEVAL V ZÁMKU!',w/2,82);
  c.font=`bold ${Math.min(18,w/34)}px Trebuchet MS, sans-serif`;c.fillStyle='#fff';c.fillText('Celý Benešov paří v zámku až do rána · starosta tančí jako kachnička',w/2,116);
}

$('#finBtn').onclick=()=>{sfx.blip();endFinale()};
/* ===================== hudba ===================== */
const song=$('#song'),songK=$('#songK');
function playSong(a,vol=.8){try{a.currentTime=0;a.volume=muted?0:vol;const p=a.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}}
function fadeSong(a,ms=1500){try{const v0=a.volume;const t0=performance.now();const f=()=>{const k=(performance.now()-t0)/ms;if(k>=1){a.pause();return}a.volume=v0*(1-k);requestAnimationFrame(f)};f()}catch(e){}}
function startMusic(){stopMusic();try{songK.loop=true;playSong(songK,.85);songK.onerror=()=>chip()}catch(e){chip()}}
function chip(){const mel=[523,659,784,659,523,659,784,1046,880,784,659,784,698,587,494,587];let i=0;music=setInterval(()=>{beep(mel[i%16],.14,'square',.03);i++},170)}
function stopMusic(){if(music){clearInterval(music);music=null}try{songK.pause()}catch(e){}}

/* ===================== obrazovky ===================== */
const scr=$('#screen'),scard=$('#scard');
function controlsHtml(){return isTouch?`<div class="keys">Joystick vlevo: nahoru = jdi/jeď dopředu, do stran = otáčení<br><b>AKCE</b> = mluvit, nasednout, sesednout · <b>MAPA</b> = velká mapa · <b>TÚÚ</b> = troubení<br>Tažením prstu po obrazovce se rozhlížíš.</div>`:
  `<div class="keys"><kbd>W</kbd>/<kbd>S</kbd> = dopředu / dozadu · <kbd>A</kbd>/<kbd>D</kbd> = otáčení · <kbd>Shift</kbd> = běh<br><kbd>E</kbd> / mezerník = mluvit, nasednout, sesednout · <kbd>H</kbd> = troubení<br><kbd>M</kbd> = velká mapa s úkoly · <kbd>V</kbd> = dabing · <kbd>Z</kbd> = zvuk · tažením myši se rozhlížíš</div>`}
let onTitle=false;
function showTitle(){
  onTitle=true;const sv=loadSave();mode='title';scr.style.display='flex';const has=sv&&sv.S&&sv.S.q>0;
  scard.innerHTML=`<div style="font-size:15px;letter-spacing:.3em;color:#9fb3d1">DETEKTIVKA Z DOLNÍHO BENEŠOVA</div><h1>KDE JE<br>STAROSTA?</h1><h2>Martin · motorka · tři dny bez starosty</h2>
  <p>Martin chce v zámku uspořádat <b>velký karneval</b>. Podepsat ho musí starosta Jenda, jenže toho <b>už tři dny nikdo neviděl</b>.</p>
  ${controlsHtml()}
  <div>${has?'<button class="btn big" id="bCont">▶ Pokračovat</button>':''}<button class="btn big" id="bNew">${has?'Nová hra':'▶ Začít hru'}</button></div>
  <p style="font-size:13px;opacity:.75;margin-top:10px">💾 Postup se ukládá automaticky${CDB?' k tvému účtu (funguje i na jiném zařízení)':' v tomto prohlížeči'}.</p>
  <p style="font-size:12px;opacity:.6;margin-top:6px">Ulice a budovy podle skutečné mapy © přispěvatelé OpenStreetMap. Postavy a příhody jsou vymyšlené. Hudba: Martin Rádek – Můj Dolní Benešov.</p>`;
  $('#bNew').onclick=()=>{ac();onTitle=false;newGame()};const bc=$('#bCont');if(bc)bc.onclick=()=>{ac();onTitle=false;continueGame(loadSave()||sv)};
}
function hideScreen(){scr.style.display='none'}
function showHelp(){mode='help';scr.style.display='flex';scard.innerHTML=`<h1 style="font-size:36px">Ovládání</h1>${controlsHtml()}<p>Žlutá šipka nahoře ukazuje, kam máš jít, a kolik je to metrů. Na velké mapě (M) najdeš místa, lidi a deník úkolů.</p><p>Hratelnou oblast ohraničuje červenobílá páska.</p><button class="btn big" id="bBack">Zpět do hry</button>`;$('#bBack').onclick=()=>{hideScreen();mode='play'}}
function showEnd(){
  mode='end';scr.style.display='flex';const m=Math.floor(S.time/60),s=Math.floor(S.time%60);
  scard.innerHTML=`<div style="font-size:15px;letter-spacing:.3em;color:#9fb3d1">PŘÍPAD UZAVŘEN</div><h1>STAROSTA<br>NALEZEN!</h1>
  <h2>…a mokrý. Karneval v zámku byl největší pařba v dějinách Dolního Benešova.</h2>
  <p>Čas pátrání: <b>${m} min ${s} s</b> · Vyhrané minihry: <b>${S.mg}</b></p>
  <p style="opacity:.85">Starosta dostal rýmu, lékárník Konrád vyprodal vitamín C a Martin je teď v Benešově legenda. Starosta slíbil, že už nikdy nic neslíbí.</p>
  <button class="btn big" id="bFree">Projíždět se po Benešově</button><button class="btn big" id="bNew2">Nová hra</button>`;
  $('#bFree').onclick=()=>{hideScreen();mode='play'};$('#bNew2').onclick=()=>newGame();
}
function resetWorld(){
  cars.length=0;peds.length=0;bubbles.length=0;crowd.length=0;crowdSpawned=false;partySpawned=false;crowdAtCastle=false;chase=null;$('#chaseHud').style.display='none';
  const [bx0,by0]=placeNear(262,236,false);bike={x:bx0,y:by0,a:0,v:0,lean:0,type:'bike'};
  spawnTraffic();spawnPeds();spawnHappy();
  for(const n of npcs){n.x=n.hx;n.y=n.hy}
  const [px,py]=placeNear(266,240);player.x=px;player.y=py;player.dir=Math.atan2(npcById.babka.y-py,npcById.babka.x-px);player.car=null;cam.yaw=player.dir;
}
const INTRO=[
  ['DOLNÍ BENEŠOV · LISTOPAD · RÁNO','Martin má velký plán.','Chce v zámku uspořádat <b>KARNEVAL</b> pro celé město. Masky, muzika, tancovačka až do rána!'],
  ['JENŽE…','Na všechno je potřeba razítko.','A hlavně podpis. Podpis pana <b>starosty Jendy</b>. Bez něj se v zámku nehne ani konfeta.'],
  ['A TAK…','Martin bere žádost a startuje motorku.','Míří na náměstí a na úřad. Ještě netuší, že starostu <b>už tři dny nikdo neviděl</b>…']
];
function newGame(){S={q:0,inv:[],time:0,mg:0};resetWorld();$('#objt').textContent=OBJ[0];renderInv();playSong(song,.85);showIntro(0)}
function showIntro(i){
  mode='title';scr.style.display='flex';const [a,b,c]=INTRO[i];
  scard.innerHTML=`<div style="font-size:14px;letter-spacing:.3em;color:#9fb3d1">${a}</div><h1 style="font-size:clamp(26px,5.5vw,44px);margin:14px 0">${b}</h1><p style="font-size:19px">${c}</p>
  <p style="font-size:13px;opacity:.7;margin-top:10px">🎵 Martin Rádek – Můj Dolní Benešov</p>
  <div style="margin-top:14px">${'●'.repeat(i+1)}${'○'.repeat(INTRO.length-i-1)}</div><button class="btn big" id="bNext">${i<INTRO.length-1?'Dál ▶':'Začít hledat ▶'}</button>`;
  $('#bNext').onclick=()=>{ac();sfx.blip();if(i<INTRO.length-1)showIntro(i+1);else startPlay()};
}
function startPlay(){hideScreen();hush();fadeSong(song,2500);S.inv=['klicky','zadost'];renderInv();setQ(0);mode='play';
  say([['','Náměstí v Dolním Benešově. Motorka stojí hned vedle Martina, městský úřad je jižně odsud, u zámku.'],['','Tip: klávesou M (nebo tlačítkem Mapa) otevřeš velkou mapu s místy, lidmi a úkoly. Žlutá šipka nahoře ukazuje cestu.']])}
function continueGame(sv){S=sv.S;resetWorld();if(walkable(sv.px,sv.py)){player.x=sv.px;player.y=sv.py}if(walkable(sv.bx,sv.by)){bike.x=sv.bx;bike.y=sv.by;bike.a=sv.ba}
  if(S.q===8)S.q=7;if(S.q>=10)crowdAtCastle=true;
  cam.yaw=player.dir;hideScreen();$('#objt').textContent=OBJ[S.q];applyQState();renderInv();mode='play'}

/* ===================== smyčka ===================== */
let last=performance.now(),saveT=0;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;animT+=dt;
  try{
  if(mode==='play'){S.time+=dt;updateWorld(dt);saveT+=dt;if(saveT>8){saveT=0;save()}}
  else if(mode==='dialog'){updDialog(dt);for(const b of bubbles)b.t-=dt}
  else if(mode==='mg'&&MG){MG.update(dt);MG.draw(mgx)}
  else if(mode==='title'||mode==='end'){for(const c of cars)if(c.ai)aiDrive(c,dt)}
  ambUpdate(dt);
  if(mode==='map')drawBigMap();
  if(mode==='finale')drawFinale(dt);else if(mode!=='mg')render(dt);
  }catch(e){console.error(e)}
  requestAnimationFrame(loop);
}
function boot(){
  if(!gl){scard.innerHTML='<h1>Ups</h1><p>Tvůj prohlížeč neumí 3D grafiku (WebGL). Zkus jiný prohlížeč nebo zapni hardwarovou akceleraci.</p>';return}
  buildGrid();initGL();buildStatic();buildGraph();buildPrimary();initNpcs();prerenderMap();resize();resetWorld();renderInv();$('#objt').textContent=OBJ[0];
  showTitle();requestAnimationFrame(loop);
}
boot();
window.G={get S(){return S},setQ:q=>setQ(q),tp:(x,y)=>{player.x=x;player.y=y},talk:id=>talk(npcById[id]),startChase,get MG(){return MG},get mode(){return mode},player,get bike(){return bike},npcById,give:addItem,startFinale,doorTalk};

</script>
