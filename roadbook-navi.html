<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="public/img/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="public/img/icon-192.png">
<title>CendurOFF Roadbook NAVI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="public/style.css?v=3.0.2">
<link rel="stylesheet" href="public/rb.css?v=3.0">
<style>body.auth-pending #app-screen{visibility:hidden;}</style>
</head>
<body class="rb-page rb-navi auth-pending">

<div id="app-screen" style="display:flex;">
  <header class="topbar" data-page="roadbook-navi"></header>

  <!-- ============ VÝBĚR TRASY: mapa přes celou plochu (v2.11) ============ -->
  <section id="nv-select">
    <div id="nv-map" role="region" aria-label="Mapa tras – klepni na trasu"></div>
    <div id="nv-label"><b id="nv-title">Vyber trasu na mapě</b><span id="nv-sub">žlutá Ready · červená To check · fialová rozpracovaný · šedá Auto</span></div>
    <p class="nv-offline-note" id="nv-offline-note" hidden>📴 Offline – jen trasy uložené v telefonu</p>
    <div id="nv-fabs">
      <button type="button" id="nv-f-list" class="wide">Seznam</button>
      <button type="button" id="nv-f-me" title="Moje poloha" aria-label="Moje poloha">◎</button>
      <button type="button" id="nv-f-zi3" aria-label="Přiblížit o 3">+3</button>
      <button type="button" id="nv-f-zi" aria-label="Přiblížit">+</button>
      <button type="button" id="nv-f-zo" aria-label="Oddálit">−</button>
      <button type="button" id="nv-f-zo3" aria-label="Oddálit o 3">−3</button>
    </div>
    <div id="nv-pick" aria-live="polite">
      <div class="t"><b id="nv-pick-name"></b><span id="nv-pick-km"></span><span id="nv-pick-badge" class="rb-badge"></span>
        <button type="button" id="nv-pick-x" aria-label="Zrušit výběr">✕</button></div>
      <div class="note" id="nv-pick-note"></div>
      <div class="nv-pick-row">
        <button type="button" class="btn-rb" id="nv-pick-dir">⇅ Směr: od začátku</button>
        <label><input type="checkbox" id="nv-simopt"> Simulace (bez GPS)</label>
      </div>
      <div class="nv-offbox" id="nv-pick-off"></div>
      <button type="button" class="btn-rb go" id="nv-pick-go">Jet ▶</button>
    </div>
    <div id="nv-listpanel" hidden>
      <div class="hd"><b>Seznam tras</b><button type="button" id="nv-list-x" aria-label="Zavřít seznam">✕</button></div>
      <label for="nv-search" style="position:absolute;left:-9999px">Hledat trasu</label>
      <input type="search" id="nv-search" placeholder="Hledat trasu…">
      <div id="nv-list"><p class="sub">Načítám trasy…</p></div>
    </div>
    <div id="nv-ask" hidden role="dialog" aria-modal="true" aria-labelledby="nv-ask-t">
      <div class="box">
        <b id="nv-ask-t">Roadbook</b>
        <p id="nv-ask-msg"></p>
        <div class="row"><button type="button" class="btn-rb go" id="nv-ask-yes">Navigovat</button><button type="button" class="btn-rb" id="nv-ask-no">Ne</button></div>
      </div>
    </div>
  </section>
</div>

<!-- ============ JÍZDA ============ -->
<div id="nv-ride" aria-live="polite">
  <div id="nv-top">
    <div id="nv-odo">
      <div class="lb">KM CELKEM</div>
      <div id="nv-km">0,00</div>
      <div class="row2"><span>DÍLČÍ <strong id="nv-par">0,00</strong></span><span>CAP <strong id="nv-cap">—</strong></span></div>
    </div>
    <div id="nv-mini" role="img" aria-label="Minimapa: trasa a aktuální poloha"></div>
  </div>
  <div id="nv-rows"><div id="nv-rows-inner"></div></div>
  <div id="nv-next">
    <div class="a"><small>DALŠÍ ZA</small><div id="nv-dist">—</div></div>
    <div class="b"><div id="nv-nextlabel"></div><div id="nv-bar"><i></i></div></div>
  </div>
  <div id="nv-btns">
    <button type="button" id="nv-minus" aria-label="Odečíst 50 metrů z počítadla">−50 m</button>
    <button type="button" id="nv-plus" aria-label="Přičíst 50 metrů k počítadlu">+50 m</button>
    <button type="button" id="nv-mapbtn">Mapa</button>
    <button type="button" id="nv-end" class="go">Konec</button>
  </div>
  <div id="nv-off"><svg id="nv-off-arrow" width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 18-7-4-7 4z" fill="#fff"/></svg><span id="nv-off-text">MIMO TRASU</span></div>
  <div id="nv-wait">Čekám na GPS signál…</div>
  <div id="nv-manual">Ruční posun – návrat za <span id="nv-manual-s">4</span> s</div>
  <div id="nv-sim"><button type="button" id="nv-sim-pause">⏸ Pauza</button><button type="button" id="nv-sim-speed">30 km/h</button></div>
  <div id="nv-bigmap"><div id="nv-bigmap-map"></div><button type="button" id="nv-bigmap-close">Zpět na roadbook</button></div>
</div>

<div class="rb-busy" id="rb-busy"><div><div id="rb-busy-text">Pracuji…</div></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="public/config.js?v=3.0"></script>
<script src="public/header.js?v=3.0.3"></script>
<script src="public/pwa.js?v=3.0"></script>
<script src="public/regiondata.js?v=3.0"></script>
<script src="public/rb-core.js?v=3.0"></script>
<script src="public/ride-stats.js?v=3.0"></script>
<script src="public/rb-navi.js?v=3.0.3"></script>
</body>
</html>
