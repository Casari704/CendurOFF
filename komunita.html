<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="canonical" href="https://cenduroff.cz/komunita.html">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#172218">
<link rel="apple-touch-icon" href="public/img/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="public/img/icon-192.png">
<title>CendurOFF Komunita</title>
<meta name="description" content="Komunita CendurOFF: uživatelé, trasy a chat.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="public/style.css?v=4.62">
<link rel="stylesheet" href="public/komunita.css?v=4.62">
</head>
<body class="kom-page">
<header class="topbar" data-page="komunita" data-auth="auto"></header>

<main class="k-wrap">
  <h1>Komunita</h1>
  <nav class="k-tabs" role="tablist" aria-label="Komunita">
    <a class="k-tab" role="tab" href="#uzivatele" data-tab="uzivatele">Uživatelé</a>
    <a class="k-tab" role="tab" href="#trasy" data-tab="trasy">Trasy</a>
    <a class="k-tab" role="tab" href="#chat" data-tab="chat">Chat</a>
    <a class="k-tab" role="tab" href="#prazdne1" data-tab="prazdne1">Prázdné 1</a>
    <a class="k-tab" role="tab" href="#prazdne2" data-tab="prazdne2">Prázdné 2</a>
    <a class="k-tab" role="tab" href="#prazdne3" data-tab="prazdne3">Prázdné 3</a>
  </nav>

  <section class="k-panel" id="uzivatele" role="tabpanel" hidden><h2>Uživatelé</h2><p class="k-empty">Připravujeme.</p></section>
  <section class="k-panel" id="trasy" role="tabpanel" hidden><h2>Trasy</h2><p class="k-empty">Připravujeme.</p></section>
  <section class="k-panel" id="chat" role="tabpanel" hidden><h2>Chat</h2><p class="k-empty">Připravujeme.</p></section>
  <section class="k-panel" id="prazdne1" role="tabpanel" hidden><h2>Prázdné 1</h2><p class="k-empty">Prázdné.</p></section>
  <section class="k-panel" id="prazdne2" role="tabpanel" hidden><h2>Prázdné 2</h2><p class="k-empty">Prázdné.</p></section>
  <section class="k-panel" id="prazdne3" role="tabpanel" hidden><h2>Prázdné 3</h2><p class="k-empty">Prázdné.</p></section>
</main>

<script src="public/config.js?v=4.62"></script>
<script src="public/errors.js?v=4.62"></script>
<script src="public/rider.js?v=4.62"></script>
<script src="public/header.js?v=4.62"></script>
<script src="public/pwa.js?v=4.62"></script>
<script>
// podružné menu: záložka podle #adresy, výchozí je první
(function(){
  const tabs = Array.from(document.querySelectorAll('.k-tab'));
  const panels = Array.from(document.querySelectorAll('.k-panel'));
  function show(){
    const id = (location.hash || '').slice(1);
    const cur = tabs.some(t => t.dataset.tab === id) ? id : tabs[0].dataset.tab;
    tabs.forEach(t => { const on = t.dataset.tab === cur; t.classList.toggle('active', on); t.setAttribute('aria-selected', on ? 'true' : 'false'); if(on) t.scrollIntoView({ block:'nearest', inline:'center' }); });
    panels.forEach(p => { p.hidden = p.id !== cur; });
  }
  window.addEventListener('hashchange', show); show();
})();
</script>
</body>
</html>
